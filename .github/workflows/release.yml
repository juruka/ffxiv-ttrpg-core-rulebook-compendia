name: Publish Foundry VTT Release

on:
  push:
    tags:
      - "*.*.*"
    branches:
      - "publish-assets/*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package module
        run: zip -r module.zip module.json lang packs scripts translations
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${GITHUB_REF_NAME#publish-assets/}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" module.json module.zip --clobber
          else
            gh release create "$release_tag" module.json module.zip --title "FFXIV TTRPG Rulebook Compendia (繁體中文) $release_tag" --generate-notes
          fi
