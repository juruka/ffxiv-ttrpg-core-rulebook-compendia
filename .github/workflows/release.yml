name: Publish Foundry VTT Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package module
        run: zip -r module.zip module.json lang packs scripts translations
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" module.zip --title "FFXIV TTRPG Rulebook Compendia (繁體中文) $GITHUB_REF_NAME" --generate-notes
